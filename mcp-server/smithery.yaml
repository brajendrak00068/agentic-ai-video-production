startCommand:
  type: stdio

configSchema:
  type: object
  properties:
    LEVEA_API_URL:
      type: string
      default: "https://api.livecore.ai"
      description: "The API endpoint for Levea Video Editor."
    LEVEA_API_KEY:
      type: string
      default: ""
      description: "Your Levea API key generated from https://livecore.ai/ (optional for discovery/health, required to execute edits)"

commandFunction: |-
  (config) => ({
    command: 'npx',
    args: ['-y', 'levea-mcp-server'],
    env: {
      LEVEA_API_URL: config?.LEVEA_API_URL || 'https://api.livecore.ai',
      LEVEA_API_KEY: config?.LEVEA_API_KEY || ''
    }
  })
